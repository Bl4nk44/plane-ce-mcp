[project]
name = "plane-ce-mcp"
version = "1.1.0"
description = "Unofficial MCP server for self-hosted Plane (Community Edition)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bl4nk44"},
]
# Original authors (upstream makeplane/plane-mcp-server):
#   Surya Prashanth <surya.prashanth@plane.so>, Plane Engineering <support@plane.so>
keywords = ["mcp", "plane", "self-hosted", "community-edition", "fastmcp", "ai", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp==3.2.0",
    "plane-sdk==0.2.19",
    "py-key-value-aio[redis]>=0.4.4,<0.5.0",
    "mcp==1.28.1",
    "PyJWT>=2.13.0",  # <2.13.0 has GHSA-xgmm-8j9v-c9wx (High) + 4 other CVEs
    "authlib>=1.6.9",
    "boto3>=1.34.0",
    # pydocket 0.16.6 (pinned by fastmcp 2.14.4) imports `FakeConnection` from
    # `fakeredis.aioredis`, which was removed in fakeredis 2.35.0.
    "fakeredis[lua]>=2.32.1,<2.35.0",
]

[tool.uv]
# Transitive deps pulled by fastmcp/starlette that ship known CVEs; force patched
# versions until the parents raise their floors. Reviewed 2026-07-12 (osv-scanner).
constraint-dependencies = [
    "python-multipart>=0.0.31",  # GHSA-5rvq-cxj2-64vf (High) + 3 others
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
]

[project.urls]
Homepage = "https://github.com/Bl4nk44/plane-ce-mcp"
Repository = "https://github.com/Bl4nk44/plane-ce-mcp"
Issues = "https://github.com/Bl4nk44/plane-ce-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.400",
    "ruff>=0.1.0",
]

[project.scripts]
plane-ce-mcp = "plane_mcp.__main__:main"
# Legacy alias kept so existing MCP client configs keep working
plane-mcp-server = "plane_mcp.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["plane_mcp*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["plane_mcp"]

[tool.pyright]
include = ["plane_mcp"]
pythonVersion = "3.10"
# Baseline is not yet clean: the plane-sdk generated models report ~27
# call-signature false positives (params with runtime defaults typed as
# required). New modules must stay clean; CI runs pyright non-blocking until
# the baseline is triaged (see docs/improvement-plan.md Stage 2.3).
typeCheckingMode = "basic"
