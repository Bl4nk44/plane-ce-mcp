name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Ruff lint
        run: ruff check plane_mcp/

      - name: Ruff format check
        run: ruff format --check plane_mcp/

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      # Non-blocking: the plane-sdk generated models produce ~27 call-signature
      # false positives. Surfaces regressions without failing the build until the
      # baseline is triaged (docs/improvement-plan.md Stage 2.3).
      - name: Pyright
        continue-on-error: true
        run: pyright plane_mcp/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      # test_integration.py needs a live Plane instance (PLANE_TEST_* env vars);
      # run it locally against a live self-host instance
      - name: Unit tests
        run: >-
          pytest tests/ --ignore=tests/test_integration.py -v
          --cov=plane_mcp --cov-report=term-missing --cov-fail-under=53

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan dependencies for known CVEs
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=uv.lock
