# Local security/quality gate, run on `git push` (not on every commit, so
# committing stays fast). One-time setup:
#
#   pre-commit install --hook-type pre-push
#
# Run everything manually: `pre-commit run --all-files --hook-stage pre-push`.
# The same tools run (blocking) in CI: ruff in ci.yml, semgrep/trivy in
# security.yml, osv-scanner in ci.yml - this hook just catches issues before
# they leave your machine. ggshield requires a one-time `ggshield auth login`.

default_install_hook_types: [pre-push]
default_stages: [pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: check-merge-conflict

  # Lint + format, config in pyproject.toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Secret scanning
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.52.2
    hooks:
      - id: ggshield

  # SAST - same rulesets as the Security workflow
  - repo: https://github.com/semgrep/semgrep
    rev: v1.165.0
    hooks:
      - id: semgrep
        args:
          - --config=p/python
          - --config=p/secrets
          - --error
          - --metrics=off
          - --exclude=tests
